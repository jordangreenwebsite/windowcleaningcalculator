    `,{actionHtml:`<button class="wcc-btn wcc-btn-primary" data-action="next" ${unsupported||!(state.propertyType&&state.storeys)?'disabled':''}>Continue →</button>`});
    bindProperty();
  }

  function locationStatusText(){
    const p=countryProfile();
    if(state.country!=='GB'){
      const area=state.postcode?` around ${escapeHtml(state.postcode)}`:'';
      const level=state.internationalMarket==='premium'?'high-cost / premium-area':state.internationalMarket==='major'?'major-city':'national-average';
      return `✓ ${p.name} beta pricing${area} using the ${level} market setting.`;
    }
    if(!state.postcode) return 'Enter as much of the postcode as you know. We never block the quote if you only know the area.';
    if(state.postcodeConfidence==='full' && state.location) return `✓ Local pricing found: ${escapeHtml(state.location.admin_district||state.location.region||state.location.country||'UK')}.`;
    if(state.postcodeConfidence==='outcode'){
      if(isFullPostcode(state.postcode)) return `✓ Full postcode recognised. Local lookup is unavailable or could not confirm it, so we’ll safely use ${escapeHtml(getOutcode(state.postcode))} pricing for now.`;
      return `✓ We can estimate from ${escapeHtml(getOutcode(state.postcode))}. Add the rest for a tighter local range.`;
    }
    if(state.postcodeConfidence==='area') return `✓ We can use average ${escapeHtml(getAreaCode(state.postcode))} area pricing. Add more postcode detail if you have it.`;
    return 'We’ll use a broader UK estimate if this postcode cannot be resolved.';
  }

  let postcodeTimer = null;
  function bindProperty(){
    document.getElementById('wcc-country')?.addEventListener('change',(e)=>{
      state.country=e.target.value; state.postcode=''; state.location=null; state.postcodeConfidence=state.country==='GB'?'none':'country'; state.internationalMarket='national'; render();
    });
    document.getElementById('wcc-postcode')?.addEventListener('input',(e)=>{
      state.postcode=e.target.value;
      if(state.country!=='GB'){ state.postcodeConfidence='country'; updateLocationStatus(); return; }
      state.postcode=e.target.value.toUpperCase();
      clearTimeout(postcodeTimer);
      postcodeTimer=setTimeout(()=>resolvePostcode(state.postcode),450);
    });
    document.getElementById('wcc-find-location')?.addEventListener('click',findMyLocation);
  }

  function findMyLocation(){
    const status=document.getElementById('wcc-location-status');
    if(!navigator.geolocation){
      if(status){ status.textContent='Location is not available in this browser — enter a postcode instead.'; status.className='wcc-location-status warn'; }
      return;
    }
    if(status){ status.textContent='Finding your nearest postcode…'; status.className='wcc-location-status'; }
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const lat=pos.coords.latitude, lon=pos.coords.longitude;
        const r=await fetch(`https://api.postcodes.io/postcodes?lon=${encodeURIComponent(lon)}&lat=${encodeURIComponent(lat)}&limit=1&radius=2000`);
        const data=await r.json();
        const nearest=data?.result?.[0];
        if(!nearest) throw new Error('No nearby postcode found');
        state.location=nearest;
        state.postcode=nearest.postcode;
        state.postcodeConfidence='full';
        const input=document.getElementById('wcc-postcode'); if(input) input.value=nearest.postcode;
        updateLocationStatus();
      }catch(e){
        if(status){ status.textContent='We could not find a nearby postcode. You can still type one manually.'; status.className='wcc-location-status warn'; }
      }
    },err=>{
      if(status){ status.textContent=err.code===1?'Location permission was not granted — postcode entry still works.':'We could not read your location — postcode entry still works.'; status.className='wcc-location-status warn'; }
    },{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
  }

  async function resolvePostcode(raw){
    if(state.country!=='GB'){ state.location=null; state.postcodeConfidence='country'; updateLocationStatus(); return; }
    const clean=normalisePostcode(raw);
    state.location=null;
    if(!clean){ state.postcodeConfidence='none'; updateLocationStatus(); return; }

    if(isFullPostcode(clean)){
      // Format a complete postcode immediately, even if the lookup service is temporarily unavailable.
      const canonical=formatFullPostcode(clean);
      state.postcode=canonical;
      const input=document.getElementById('wcc-postcode'); if(input) input.value=canonical;

      try{
        // Primary exact lookup. Postcodes.io accepts spaced/unspaced and mixed-case postcodes.
        let r=await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(clean)}`);
        if(r.ok){
          const data=await r.json();
          if(data && data.result){
            state.location=data.result;
            state.postcode=data.result.postcode || canonical;
            state.postcodeConfidence='full';
            if(input) input.value=state.postcode;
            updateLocationStatus(); return;
          }
        }

        // Redundant search fallback. This protects the UX if the exact endpoint behaves oddly.
        r=await fetch(`https://api.postcodes.io/postcodes?query=${encodeURIComponent(canonical)}&limit=10`);
        if(r.ok){
          const data=await r.json();
          const exact=(data.result||[]).find(x=>normalisePostcode(x.postcode)===clean);
          if(exact){
            state.location=exact;
            state.postcode=exact.postcode || canonical;
            state.postcodeConfidence='full';
            if(input) input.value=state.postcode;
            updateLocationStatus(); return;
          }
        }
      }catch(e){ if(CONFIG.debug) console.warn('Postcode lookup unavailable',e); }

      // Valid-looking full postcode but lookup unavailable/not found: still price from the outward code.
      state.postcodeConfidence='outcode';
      updateLocationStatus(); return;
    }

    const out=getOutcode(raw);
    if(/^[A-Z]{1,2}\d[A-Z\d]?$/.test(out)) state.postcodeConfidence='outcode';
    else if(getAreaCode(clean)) state.postcodeConfidence='area';
    else state.postcodeConfidence='none';
    updateLocationStatus();
  }

  function updateLocationStatus(){
    const el=document.getElementById('wcc-location-status');
    if(!el) return;
    el.innerHTML=locationStatusText();
    el.className='wcc-location-status '+(state.country!=='GB'?'good':state.postcodeConfidence==='full'?'good':state.postcode?'warn':'');
  }

  function renderWindows(){
    const types=state.userType==='cleaner'?CLEANER_TYPES:CUSTOMER_TYPES;

  function counterCard(key,label,count){
    return `<div class="wcc-counter ${count?'has-value':''}" data-counter-card="${key}">
      <div class="wcc-window-picture" data-inc="${key}">${windowSvg(key)}</div>
      <div class="wcc-counter-name">${label}</div>
      <div class="wcc-counter-controls"><button class="wcc-counter-btn" data-dec="${key}" aria-label="Remove ${label}">−</button><input class="wcc-count-input" data-count-input="${key}" type="number" min="0" max="999" step="1" inputmode="numeric" value="${count}" aria-label="${label} quantity"><button class="wcc-counter-btn" data-inc="${key}" aria-label="Add ${label}">+</button></div>
    </div>`;
  }

  function bindCounters(group){
    const store = group==='windows' ? state.windows : state.conservatory;

    function syncCounter(key, value, writeInput=true){
      const clean=Math.max(0,Math.min(999,Math.floor(Number(value)||0)));
      store[key]=clean;
      if(writeInput){
        app.querySelectorAll(`[data-count-input="${key}"]`).forEach(input=>{ input.value=String(clean); });
      }
      app.querySelectorAll(`[data-counter-card="${key}"]`).forEach(card=>card.classList.toggle('has-value',clean>0));
      if(group==='windows'){
        const next=app.querySelector('[data-action="next"]');
        if(next) next.disabled=windowEquivalentCount()<=0;
      }
    }

    app.querySelectorAll('[data-inc]').forEach(el=>el.addEventListener('click',()=>{
      const k=el.dataset.inc;
      if(!(k in store)) return;
      syncCounter(k,(store[k]||0)+1);
    }));
    app.querySelectorAll('[data-dec]').forEach(el=>el.addEventListener('click',()=>{
      const k=el.dataset.dec;
      if(!(k in store)) return;
      syncCounter(k,(store[k]||0)-1);
    }));
    app.querySelectorAll('[data-count-input]').forEach(input=>{
      input.addEventListener('input',(e)=>{
        const k=e.target.dataset.countInput;
        if(!(k in store)) return;
        let raw=String(e.target.value||'').replace(/[^0-9]/g,'');
        if(raw.length>3) raw=raw.slice(0,3);
        e.target.value=raw;
        syncCounter(k,raw===''?0:Number(raw),false);
      });
      input.addEventListener('blur',(e)=>{
        const k=e.target.dataset.countInput;
        if(!(k in store)) return;
        syncCounter(k,store[k]||0,true);
      });
    });
  }

  function windowEquivalentCount(){ return Object.values(state.windows).reduce((a,b)=>a+Number(b||0),0); }

    const range=expected[state.propertyType];
    if(range && n>0 && n<range[0]) return `<div class="wcc-warning">That’s quite a low glass count for the property selected. That may be correct — just check you’ve included doors and larger panes before continuing.</div>`;
    return '';
  }

  let deferredInstallPrompt=null;
  function isStandalone(){
    return window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone===true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent||'');

  function isMobile(){
    return /android|iphone|ipad|ipod/i.test(navigator.userAgent||'') || window.matchMedia?.('(max-width: 760px)').matches;

  function setupPWA(){
    if(!document.querySelector('link[rel="manifest"]')){
      const link=document.createElement('link'); link.rel='manifest'; link.href='/wcc-manifest.webmanifest'; document.head.appendChild(link);
    }
    if(!document.querySelector('link[rel="apple-touch-icon"]')){
      const icon=document.createElement('link'); icon.rel='apple-touch-icon'; icon.href='/wcc-apple-touch-icon.png'; document.head.appendChild(icon);
    }
    if(!document.querySelector('meta[name="theme-color"]')){
      const meta=document.createElement('meta'); meta.name='theme-color'; meta.content='#1E3A5F'; document.head.appendChild(meta);
    }
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('/wcc-sw.js').catch(()=>{}),{once:true});
    }
    window.addEventListener('beforeinstallprompt',(e)=>{
      e.preventDefault(); deferredInstallPrompt=e; updateInstallButton();
    });
    window.addEventListener('appinstalled',()=>{ deferredInstallPrompt=null; updateInstallButton(); });
  }
  function updateInstallButton(){
    const btn=document.getElementById('wcc-install-btn');
    if(!btn) return;
    const show=!isStandalone() && (!!deferredInstallPrompt || isIOS() || isMobile());
    btn.classList.toggle('wcc-hidden',!show);
  }
  function bindInstallButton(){
    const btn=document.getElementById('wcc-install-btn');
    updateInstallButton();
    btn?.addEventListener('click',async()=>{
      if(deferredInstallPrompt){
        deferredInstallPrompt.prompt();
        try{ await deferredInstallPrompt.userChoice; }catch(e){}
        deferredInstallPrompt=null; updateInstallButton(); return;
      }
      if(isIOS()){ showIOSInstallHelp(); return; }
      showGenericInstallHelp();
    });
  }

  function getLocationFactors(){
    if(state.country!=='GB'){
      const p=countryProfile();
      let market=1.00;
      if(state.internationalMarket==='major') market=p.major||1.15;
      if(state.internationalMarket==='premium') market=p.premium||1.30;
      return {market,friction:1.00,combined:market,reason:`${p.name} ${state.internationalMarket}`,outcode:state.postcode||p.name};
    }
    const raw=state.postcode;
    const out=(state.location?.outcode || getOutcode(raw)).toUpperCase();
    const area=getAreaCode(raw);
    let market=1.00;
    let reason='UK baseline';

    if(state.location){
      const district=state.location.admin_district || state.location.parish || '';
      const region=state.location.region || state.location.country || '';
      market=REGION_MARKET[region] || REGION_MARKET[state.location.country] || 1.00;
      reason=region || state.location.country || reason;
      if(DISTRICT_MARKET[district]) { market=DISTRICT_MARKET[district]; reason=district; }
    } else if(AREA_FALLBACK[area]) { market=AREA_FALLBACK[area]; reason=`${area} postcode area`; }

    if(OUTCODE_MARKET[out]) { market=OUTCODE_MARKET[out]; reason=`${out} local market`; }
    market=clamp(market,0.75,1.30);

    let friction=1.00;
    if(CENTRAL_LONDON_RE.test(out)) friction=1.15;
    else if(CITY_FRICTION[out]) friction=CITY_FRICTION[out];
    else if(state.location?.region==='London') friction=1.05;

    let combined=clamp(market*friction,0.75,1.50);
    const lowWales=LOW_COST_WALES_OUTCODES.has(out) || LOW_COST_WALES_DISTRICTS.has(state.location?.admin_district||'');
    const pricingNote=lowWales?'This is one of the lower-priced regular-round markets in our current model. Very established or legacy rounds can still be cheaper than the estimate shown.':'';
    return {market,friction,combined,reason,outcode:out||area||'UK',lowWales,pricingNote};
  }

  function accessPricing(){
    const p=countryProfile();
    const cfg=PRICING.access[state.access]||PRICING.access.easy;
    return {factor:cfg.factor||1,fixed:(cfg.fixed||0)*p.windowScale};
  }

  function localMinimumBase(location){
    const p=countryProfile();
    if(state.country!=='GB') return p.minimum;
    if(location?.lowWales) return 10;
    if(state.location?.country==='Wales' || state.location?.region==='Wales' || ['CF','NP','SA','LL','LD'].includes(getAreaCode(state.postcode))) return 11;
    return p.minimum;
  }

  function priceMainExterior(){
    const p=countryProfile();
    let glass=p.setup;
    Object.entries(state.windows).forEach(([k,count])=>{ glass += (PRICING.windows[k]||0)*p.windowScale*Number(count||0); });
    const access=accessPricing();
    let complexity=glass*(PRICING.height[String(state.storeys)]||1)*access.factor + access.fixed;
    const location=getLocationFactors();
    const minimumBase=localMinimumBase(location);
    let preFrequency=Math.max(complexity,minimumBase);
    const minimumApplied=complexity<minimumBase;
    const frequencyFactor=PRICING.frequency[state.frequency]||1;
    const regular=preFrequency*frequencyFactor*location.combined;
    const firstBase=regular*(PRICING.firstClean[state.condition]||1.50);
    const regularMinimum=minimumBase*frequencyFactor*location.combined;
    return {glass,complexity,preFrequency,minimumBase,minimumApplied,regularMinimum,frequencyFactor,location,regular,first:firstBase,access};
  }

  function insideScheduleFactor(){
    if(state.insideFrequency==='oneoff') return PRICING.insideFrequency.oneoff;
    if(state.insideFrequency==='everyOther') return PRICING.insideFrequency.everyOther;
    if(state.insideFrequency==='custom'){
      const every=clamp(Number(state.insideEveryN)||3,2,12);
      return 1 + Math.min(.32,.08*(every-1));
    }
    return PRICING.insideFrequency.every;
  }

  function insideScheduleLabel(){
    if(state.insideFrequency==='oneoff') return 'one-off';
    if(state.insideFrequency==='everyOther') return 'every other clean';
    if(state.insideFrequency==='custom') return `every ${clamp(Number(state.insideEveryN)||3,2,12)} cleans`;
    return 'every clean';
  }

  function priceInside(main){
    if(!state.inside) return 0;
    const access=PRICING.insideAccess[state.insideAccess]||1;
    let factor;
    if(state.userType==='cleaner') factor=(PRICING.insideSpeed[state.insideSpeed]||1.35)*access;
    else factor=PRICING.customerInsideBase*access;
    factor*=insideScheduleFactor();
    return Math.max(main.regular, main.regular*factor);
  }

  function priceConservatory(location){
    const c=state.conservatory;
    const cs=countryProfile().conservatoryScale||1;
    if(!c.enabled) return {exteriorSides:0,exteriorRoof:0,interiorSides:0,interiorRoof:0,total:0};
    let exteriorSides=0, exteriorRoof=0, interiorSides=0, interiorRoof=0;

    const sideExteriorRaw = (c.sideSmall*PRICING.conservatory.sideSmallExterior + c.sideMedium*PRICING.conservatory.sideMediumExterior + c.sideLarge*PRICING.conservatory.sideLargeExterior + c.sideDoor*PRICING.conservatory.sideDoorExterior)*cs;
    if(c.exteriorSides) exteriorSides = sideExteriorRaw*location.combined;

    if(c.exteriorRoof){
      const raw=Math.max(PRICING.conservatory.exteriorRoofMinimum*cs, (PRICING.conservatory.exteriorRoofSetup + c.roofStandard*PRICING.conservatory.roofStandardExterior + c.roofLarge*PRICING.conservatory.roofLargeExterior)*cs);
      exteriorRoof=raw*(PRICING.conservatory.roofCondition[c.roofCondition]||1)*location.combined;
    }

    if(c.interiorSides){
      let raw=(PRICING.conservatory.interiorSideSetup + c.sideSmall*PRICING.conservatory.sideSmallInterior + c.sideMedium*PRICING.conservatory.sideMediumInterior + c.sideLarge*PRICING.conservatory.sideLargeInterior + c.sideDoor*PRICING.conservatory.sideDoorInterior)*cs;
      let speed=state.userType==='cleaner'?(PRICING.insideSpeed[state.insideSpeed]||1.35):1.10;
      let access=PRICING.insideAccess[state.insideAccess]||1;
      interiorSides=Math.max(50*cs,raw*speed*access)*location.combined;
    }

    if(c.interiorRoof){
      let raw=Math.max(PRICING.conservatory.interiorRoofMinimum*cs, (PRICING.conservatory.interiorRoofSetup + c.roofStandard*PRICING.conservatory.roofStandardInterior + c.roofLarge*PRICING.conservatory.roofLargeInterior)*cs);
      raw*=PRICING.conservatory.roofShape[c.roofShape]||1.15;
      raw*=PRICING.conservatory.blinds[c.blinds]||1;
      if(state.userType==='cleaner') raw*=PRICING.conservatory.experience[c.experience]||1;
      interiorRoof=raw*location.combined;
    }
    return {exteriorSides,exteriorRoof,interiorSides,interiorRoof,total:exteriorSides+exteriorRoof+interiorSides+interiorRoof};
  }

  function confidenceSpread(){
    if(state.country!=='GB') return state.internationalMarket==='national'?.22:.18;
    return {full:.10,outcode:.14,area:.20,none:.25}[state.postcodeConfidence] ?? .20;
  }

  function tier(price){
    const typical=roundPound(price);
    return {competitive:roundPound(typical*PRICING.cleanerCompetitive),typical,premium:roundPound(typical*PRICING.cleanerPremium)};
  }
  function customerBand(price){
    const typical=roundPound(price), spread=confidenceSpread();
    return {low:roundPound(typical*(1-spread)),typical,high:roundPound(typical*(1+spread))};
  }

  function calculate(){
    const main=priceMainExterior();
    const inside=priceInside(main);
    const con=priceConservatory(main.location);
    const selectedTotal=Math.max(main.regular+inside+con.total,main.regular);
    const firstTotal=(state.frequency==='oneoff'?main.regular:main.first)+inside+con.total;
    const typical=roundPound(selectedTotal);
    const totalBand=customerBand(selectedTotal);
    const totalTier=tier(selectedTotal);
    return {
      main, inside, con,
      exterior:customerBand(main.regular),
      exteriorTier:tier(main.regular),
      insideBand:inside?customerBand(inside):null,
      insideTier:inside?tier(inside):null,
      conBands:{
        exteriorSides:con.exteriorSides?customerBand(con.exteriorSides):null,
        exteriorRoof:con.exteriorRoof?customerBand(con.exteriorRoof):null,
        interiorSides:con.interiorSides?customerBand(con.interiorSides):null,
        interiorRoof:con.interiorRoof?customerBand(con.interiorRoof):null
      },
      conTiers:{
        exteriorSides:con.exteriorSides?tier(con.exteriorSides):null,
        exteriorRoof:con.exteriorRoof?tier(con.exteriorRoof):null,
        interiorSides:con.interiorSides?tier(con.interiorSides):null,
        interiorRoof:con.interiorRoof?tier(con.interiorRoof):null
      },
      firstBand:state.frequency==='oneoff'?null:customerBand(firstTotal),
      firstTier:state.frequency==='oneoff'?null:tier(firstTotal),
      totalBand,totalTier,
      typical,low:totalBand.low,high:totalBand.high,
      competitive:totalTier.competitive,premium:totalTier.premium,
      first:roundPound(firstTotal),
      location:main.location,
      summary:summaryText()
    };
  }

  function summaryText(){
    const bits=[];
    bits.push(`${windowEquivalentCount()} main glass items`);
    bits.push(`${state.storeys}-storey`);
    if(state.frequency) bits.push(state.frequency==='oneoff'?'one-off':`${state.frequency}-weekly`);
    if(state.country==='GB'){ const out=getOutcode(state.postcode); if(out) bits.push(out); } else { bits.push(countryProfile().name); }
    return bits.join(' · ');
  }

  function calculateAndShow(){
    state.result=calculate();
    state.step=6;
    state.resultLogged=false;
    render();
  }

  function frequencyLabel(){
    if(state.frequency==='oneoff') return 'one-off';
    return `every ${state.frequency} weeks`;
  }

  function serviceQuoteCard(label, price, note='', featured=false){
    const cleaner=state.userType==='cleaner';

      r.con.exteriorSides?serviceQuoteCard('Conservatory outside side glass',r.con.exteriorSides,'Usually treated as a separate add-on'): '',
      r.con.exteriorRoof?serviceQuoteCard('Conservatory outside roof',r.con.exteriorRoof,'One-off / specialist roof clean'): '',

          ${r.main.minimumApplied?`<div class="wcc-minimum-note"><strong>Minimum visit price applied.</strong> Very small jobs still have travel, setup and collection/payment time. That’s why, for example, four windows will not always cost exactly half as much as eight. The current minimum for this frequency/location is about <strong>${money(r.main.regularMinimum)}</strong>.</div>`:''}

          ${cleaner && ['throughHouse','balconyHouse'].includes(state.access)?'<div class="wcc-warning" style="text-align:left"><strong>Access premium included:</strong> jobs that require carrying equipment through the property are deliberately marked up. Some cleaners choose not to take them at all.</div>':''}
          ${cleaner && state.inside && state.insideSpeed==='slow'?'<div class="wcc-warning" style="text-align:left">You selected <strong>still learning / slow</strong> for inside work. If you expect this job to take you significantly longer, use the Premium figure rather than squeezing your hourly return.</div>':''}
          ${cleaner && state.conservatory.interiorRoof && state.conservatory.experience==='new'?'<div class="wcc-warning" style="text-align:left"><strong>Internal conservatory roof warning:</strong> you said this is new to you. These can be much slower than expected. The Premium figure gives you more protection while you learn your real working time.</div>':''}

        </div>

  function bindResult(){
    app.querySelectorAll('[data-result-action]').forEach(el=>el.addEventListener('click',()=>{
      const action=el.dataset.resultAction;
      if(action==='back'){ state.step=5; state.result=null; render(); }
      if(action==='print') window.print();
      if(action==='image') saveResultImage();
      if(action==='restart') restart();
      if(action==='emailFocus'){ document.getElementById('wcc-email-box')?.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>document.getElementById('wcc-result-email')?.focus(),250); }
      if(action==='dismissEmail') document.getElementById('wcc-email-box')?.classList.add('wcc-hidden');
      if(action==='email') sendEmailResult();
      if(action==='feedback') sendFeedback();
    }));
  }

  function buildPayload(){
    const r=state.result||calculate();
    return {
      action:'save_calculation',
      calc_id:state.calcId,
      timestamp:new Date().toISOString(),
      user_type:state.userType,
      postcode_area:state.country==='GB'?(getOutcode(state.postcode)||getAreaCode(state.postcode)||''):'',
      local_area:state.country==='GB'?(state.location?.admin_district||state.location?.region||''):(state.postcode||countryProfile().name),
      property_type:state.propertyType,
      storeys:state.storeys,
      windows:JSON.stringify(state.windows),
      frequency:state.frequency,
      condition:state.condition,
      access:state.access,
      inside:state.inside,
      inside_frequency:state.inside?state.insideFrequency:'',
      inside_every_n:state.inside&&state.insideFrequency==='custom'?state.insideEveryN:'',
      inside_access:state.insideAccess,
      inside_speed:state.userType==='cleaner'?state.insideSpeed:'',
      conservatory:JSON.stringify(state.conservatory),
      base_price:roundPound(r.main.preFrequency),
      market_multiplier:r.location.market,
      friction_multiplier:r.location.friction,
      estimate_low:r.low,
      estimate_typical:r.typical,
      estimate_high:r.high,
      first_clean:r.first,
      consent_version:'WCC_MARKETING_V1',
      country:state.country,
      currency:countryProfile().currency,
      location_input:state.country==='GB'?(getOutcode(state.postcode)||getAreaCode(state.postcode)||''):(state.postcode||''),
      international_market:state.country==='GB'?'':state.internationalMarket
    };
  }

  async function submitBackend(action,payload){
    if(!CONFIG.appsScriptUrl || CONFIG.appsScriptUrl.includes('PASTE_YOUR')){
      if(CONFIG.debug) console.log('[WCC test mode]',action,payload);
      return false;
    }
    const body={...payload,action};
    try{
      await fetch(CONFIG.appsScriptUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),keepalive:true});
      return true;
    }catch(e){ if(CONFIG.debug) console.warn('Backend submit failed',e); return false; }
  }

  async function sendEmailResult(){
    const email=(document.getElementById('wcc-result-email')?.value||'').trim();
    const status=document.getElementById('wcc-email-status');
    if(!/^\S+@\S+\.\S+$/.test(email)){ status.textContent='Please enter a valid email address.'; return; }
    const marketing=state.userType==='cleaner' && !!document.getElementById('wcc-marketing')?.checked;
    status.textContent='Sending…';
    await submitBackend('email_result',{...buildPayload(),email,marketing_consent:marketing,consent_timestamp:marketing?new Date().toISOString():'',result_html:emailSummaryHtml()});
    state.emailSent=true;
    status.innerHTML='<span class="wcc-small-success">✓ Request sent. Check your inbox shortly.</span>';
  }

  function emailSummaryHtml(){
    const r=state.result, cleaner=state.userType==='cleaner';
    const line=(label,price)=>cleaner?`<p><strong>${escapeHtml(label)}</strong>: Competitive ${money(tier(price).competitive)} · Typical ${money(price)} · Premium ${money(tier(price).premium)}</p>`:`<p><strong>${escapeHtml(label)}</strong>: ${money(customerBand(price).low)}–${money(customerBand(price).high)} (typical ${money(price)})</p>`;
    let html=`<h2>Your Window Cleaning Estimate</h2>${line(state.frequency==='oneoff'?'Exterior one-off':`Exterior ${frequencyLabel()}`,r.main.regular)}`;
    if(r.inside) html+=line(`Inside windows · ${insideScheduleLabel()}`,r.inside);
    if(r.con.exteriorSides) html+=line('Conservatory outside side glass',r.con.exteriorSides);
    if(r.con.exteriorRoof) html+=line('Conservatory outside roof',r.con.exteriorRoof);
    if(r.con.interiorSides) html+=line('Conservatory inside side glass',r.con.interiorSides);
    if(r.con.interiorRoof) html+=line('Conservatory inside roof',r.con.interiorRoof);
    if(state.frequency!=='oneoff') html+=line('First-clean total',r.first);
    return html+`<p>${escapeHtml(r.summary)}</p><p><a href="${CONFIG.siteUrl}">WindowCleaningCalculator.co.uk</a><br>Built by UK Trade Websites</p>`;
  }

  async function sendFeedback(){
    if(state.feedbackSent) return;
    const input=document.getElementById('wcc-feedback-price');
    const status=document.getElementById('wcc-feedback-status');
    const btn=document.getElementById('wcc-feedback-submit');
    const box=document.getElementById('wcc-feedback-box');
    const price=Number(input?.value||0);
    if(price<=0){ status.innerHTML='<div class="wcc-help">Enter the price you would actually quote for the main exterior clean.</div>'; return; }
    if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }
    await submitBackend('cleaner_feedback',{...buildPayload(),cleaner_price:price});
    state.feedbackSent=true;
    if(input) input.disabled=true;
    if(btn){ btn.textContent='✓ Submitted'; btn.className='wcc-btn wcc-btn-primary'; }
    box?.classList.add('is-submitted');
    status.innerHTML='<div class="wcc-small-success"><strong>✓ Feedback submitted.</strong> Thank you — your price has been recorded.</div>';
  }

  function saveResultImage(){
    const r=state.result;
    const cleaner=state.userType==='cleaner';
    const rows=[];
    rows.push([state.frequency==='oneoff'?'Exterior one-off':`Exterior ${frequencyLabel()}`, cleaner?`Typical ${money(r.main.regular)} · ${money(tier(r.main.regular).competitive)}–${money(tier(r.main.regular).premium)}`:`${money(customerBand(r.main.regular).low)}–${money(customerBand(r.main.regular).high)} · typical ${money(r.main.regular)}`]);
    if(r.inside) rows.push([`Inside · ${insideScheduleLabel()}`,`Typical ${money(r.inside)}`]);
    if(r.con.exteriorRoof) rows.push(['Conservatory outside roof',money(r.con.exteriorRoof)]);
    if(r.con.interiorRoof) rows.push(['Conservatory inside roof',money(r.con.interiorRoof)]);
    if(state.frequency!=='oneoff') rows.push(['First-clean total',money(r.first)]);
    const width=1200,height=760;
    const rowSvg=rows.slice(0,5).map((row,i)=>`<text x="110" y="${410+i*48}" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">${escapeHtml(row[0])}</text><text x="1090" y="${410+i*48}" text-anchor="end" font-family="Arial,sans-serif" font-size="22" fill="#667085">${escapeHtml(row[1])}</text>`).join('');
    const main=cleaner?money(r.main.regular):`${money(r.exterior.low)} – ${money(r.exterior.high)}`;
    const subtitle=cleaner?`Typical exterior quote · Competitive ${money(r.exteriorTier.competitive)} · Premium ${money(r.exteriorTier.premium)}`:`Typical exterior price ${money(r.exterior.typical)}`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="1200" height="760" fill="#F5F7FA"/><rect x="65" y="55" rx="28" width="1070" height="650" fill="#fff" stroke="#DCE3EA" stroke-width="2"/><rect x="65" y="55" rx="28" width="1070" height="12" fill="#1E3A5F"/><rect x="420" y="55" width="350" height="12" fill="#4A6FA5"/><rect x="770" y="55" rx="6" width="365" height="12" fill="#FF8C42"/><text x="110" y="125" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">Window Cleaning Calculator</text><text x="110" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#667085">EXTERIOR ${escapeHtml(frequencyLabel().toUpperCase())}</text><text x="110" y="310" font-family="Arial,sans-serif" font-size="86" font-weight="800" fill="#1E3A5F">${escapeHtml(main)}</text><text x="110" y="352" font-family="Arial,sans-serif" font-size="22" fill="#667085">${escapeHtml(subtitle)}</text>${rowSvg}<text x="110" y="675" font-family="Arial,sans-serif" font-size="19" fill="#667085">WindowCleaningCalculator.co.uk</text><text x="1090" y="675" text-anchor="end" font-family="Arial,sans-serif" font-size="19" fill="#4A6FA5">Built by UK Trade Websites</text></svg>`;
    const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0);
      URL.revokeObjectURL(url);
      canvas.toBlob(png=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(png); a.download=`window-cleaning-${cleaner?'quote':'estimate'}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); },'image/png',.95);
    };
    img.src=url;
  }

  function restart(){
    sessionStorage.removeItem('wcc-state');
    const fresh={...state};
    fresh.step=1; fresh.userType=null; fresh.country=detectCountry(); fresh.internationalMarket='national'; fresh.postcode=''; fresh.location=null; fresh.postcodeConfidence='none'; fresh.propertyType=null; fresh.storeys=null;
    fresh.windows={small:0,standard:0,large:0,door:0,french:0,bay:0,velux:0,sash:0,mullioned:0,leaded:0,bifold:0};
    fresh.frequency=null; fresh.condition='maintained'; fresh.access='easy'; fresh.inside=false; fresh.insideFrequency='every'; fresh.insideEveryN=3; fresh.insideAccess='normal'; fresh.insideSpeed='average';
    fresh.conservatory={enabled:false,exteriorSides:false,exteriorRoof:false,interiorSides:false,interiorRoof:false,sideSmall:0,sideMedium:0,sideLarge:0,sideDoor:0,roofStandard:0,roofLarge:0,roofShape:'pitched',roofCondition:'maintained',blinds:'none',experience:'regular'};
    fresh.calcId=cryptoRandomId(); fresh.result=null; fresh.resultLogged=false; fresh.emailSent=false; fresh.feedbackSent=false;
    Object.assign(state,fresh); render();
  }

  setupPWA();

  // Restore unfinished wizard after a refresh, but never restore a finished result.
  try{
    const saved=JSON.parse(sessionStorage.getItem('wcc-state')||'null');
    if(saved && saved.step && saved.step<6){ Object.assign(state,saved,{location:null,result:null}); if(state.country==='GB' && state.postcode) resolvePostcode(state.postcode); }
  }catch(e){}

  render();
})();
</script>
